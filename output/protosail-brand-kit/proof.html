<!doctype html><html><head><meta charset="utf-8"/><style>*{box-sizing:border-box}body{margin:0;width:1440px;background:#f5f6ef;color:#111;font-family:Arial,sans-serif}.title{height:105px;padding:32px 40px;display:flex;justify-content:space-between;align-items:center}.title h1{font-size:24px;letter-spacing:-.02em;font-weight:500;margin:0}.title p{font-size:12px;color:#62665a}.hero{height:300px;background:#141414;display:flex;align-items:center;padding:0 65px}.hero img{width:100%;max-height:295px}.row{display:grid;border-bottom:1px solid #d6d9cd}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr 1fr}.cell{position:relative;background:#fff;display:flex;justify-content:center;align-items:center;height:275px;border-right:1px solid #d6d9cd;padding:48px 22px 20px}.cell.dark{background:#141414;border-color:#303030}.cell label{position:absolute;left:24px;top:18px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#62665a}.cell.dark label{color:#ababab}.cell img{display:block;width:100%;max-height:190px}.cell.icon img{width:240px;height:240px;max-height:none}.cell.stacked{height:320px}.cell.stacked img{max-height:270px}.cell.app{height:320px}.cell.app img{width:190px;height:190px;max-height:none}.footer{height:95px;padding:24px 40px;display:flex;justify-content:space-between;font-size:12px;color:#636658}.colours{display:flex;gap:18px;align-items:center}.colours i{display:inline-block;width:22px;height:22px;vertical-align:middle;border:1px solid #d5d8cc;margin-right:8px}</style></head><body><div class="title"><h1>PROTOSAIL / Vector identity</h1><p>PRECISE GEOMETRY &nbsp;·&nbsp; SORA 800 &nbsp;·&nbsp; SHARED MASTERS</p></div><div class="hero"><img src="svg/protosail-primary-lime-white.svg" alt="Protosail integrated logo"/></div><div class="row three"><div class="cell dark icon"><label>01 / Sail icon</label><img class="" src="svg/protosail-icon-lime.svg" alt="Protosail icon — Lime"></div><div class="cell  icon"><label>02 / Monochrome</label><img class="" src="svg/protosail-icon-black.svg" alt="Protosail icon — Solid charcoal"></div><div class="cell dark icon"><label>03 / Reverse</label><img class="" src="svg/protosail-icon-white.svg" alt="Protosail icon — Solid white"></div></div><div class="row two"><div class="cell  wordmark"><label>04 / Wordmark</label><img class="" src="svg/protosail-wordmark-black.svg" alt="Protosail wordmark — Solid charcoal"></div><div class="cell dark horizontal"><label>05 / Horizontal compact</label><img class="" src="svg/protosail-horizontal-lime-white.svg" alt="Protosail horizontal — Lime / white"></div></div><div class="row three"><div class="cell  stacked"><label>06 / Stacked, panel on white</label><img class="" src="svg/protosail-stacked-panel-white.svg" alt="Protosail stacked — Charcoal panel on white"></div><div class="cell dark stacked"><label>07 / Stacked, dark</label><img class="" src="svg/protosail-stacked-lime-white.svg" alt="Protosail stacked — Lime / white"></div><div class="cell  app"><label>08 / App icon</label><img class="" src="svg/protosail-app-lime.svg" alt="Protosail app — Lime on charcoal"></div></div><div class="row"><div class="cell  primary"><label>09 / Primary, panel on white</label><img class="" src="svg/protosail-primary-panel-white.svg" alt="Protosail primary — Charcoal panel on white"></div></div><div class="footer"><p>One set of paths. Uniform scale. Native Sora spacing.<br>SVG masters + PNG exports + favicon + construction guide.</p><div class="colours"><span><i style="background:#e3f941"></i>#E3F941</span><span><i style="background:#141414"></i>#141414</span><span><i style="background:#fff"></i>#FFFFFF</span></div></div></body></html>
